services:
  pc2-fallback-vllm:
    image: vllm/vllm-openai:latest
    container_name: pc2-fallback-vllm
    restart: unless-stopped
    ports:
      - "8000:8000"
    gpus: all
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    command:
      - --model
      - Qwen/Qwen2.5-1.5B-Instruct-AWQ
      - --served-model-name
      - Qwen/Qwen2.5-1.5B-Instruct-AWQ
      - --quantization
      - awq
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "256"
      - --gpu-memory-utilization
      - "0.75"
      - --dtype
      - half
