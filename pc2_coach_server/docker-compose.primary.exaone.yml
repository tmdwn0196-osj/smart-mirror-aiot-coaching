services:
  pc2-primary-exaone:
    image: vllm/vllm-openai:latest
    container_name: pc2-primary-exaone
    restart: unless-stopped
    ports:
      - "8100:8000"
    gpus: all
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    command:
      - --model
      - LGAI-EXAONE/EXAONE-3.5-2.4B-Instruct
      - --served-model-name
      - LGAI-EXAONE/EXAONE-3.5-2.4B-Instruct
      - --trust-remote-code
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "2048"
      - --gpu-memory-utilization
      - "0.85"
      - --dtype
      - half
      - --enforce-eager
