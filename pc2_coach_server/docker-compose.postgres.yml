services:
  pc2-postgres:
    image: postgres:16-alpine
    container_name: pc2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pc2_coach
      POSTGRES_USER: pc2
      POSTGRES_PASSWORD: pc2pass
      TZ: Asia/Seoul
    ports:
      - "5430:5432"
    volumes:
      - pc2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pc2 -d pc2_coach"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pc2_postgres_data:
